<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A27 KSG Operator Lab</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background:#111;
            color:#eee;
            font-family:Arial, sans-serif;
            padding:20px;
        }
        .panel{
            background:#1b1b1b;
            border-radius:10px;
            padding:20px;
            margin-bottom:20px;
        }
        img{
            max-width:100%;
            border:1px solid #444;
            margin-top:10px;
        }
        textarea{
            width:100%;
            height:80px;
            background:#222;
            color:#fff;
            border:1px solid #555;
            padding:10px;
        }
        input{
            background:#222 !important;
            color:#fff !important;
            border:1px solid #555 !important;
        }
        .btn{
            margin-right:8px;
            margin-bottom:8px;
        }
        #output{
            white-space:pre-wrap;
            background:#000;
            padding:15px;
            border-radius:8px;
            min-height:140px;
            margin-top:15px;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="container">

    <h2 class="mb-4">A27 — Kaprekar Spectral Geometry Operator Lab</h2>

    <div class="panel">

        <label>π Profile (comma separated)</label>
        <textarea id="piInput">10,20,30,40,30,20,10</textarea>

        <label class="mt-3">Gamma</label>
        <input type="number" step="0.05" id="gammaInput" value="0.5" class="form-control">

        <div class="mt-4">
            <button class="btn btn-primary" onclick="runHermitian()">Hermitian Metrics</button>
            <button class="btn btn-success" onclick="runNH()">NonHermitian Metrics</button>
            <button class="btn btn-info" onclick="runResolvent()">Resolvent Scan</button>
            <button class="btn btn-secondary" onclick="sweepAtlas()">Sweep Atlas</button>
            <button class="btn btn-warning" onclick="mineAtlas()">Mine Atlas</button>
            <button class="btn btn-danger" onclick="discover()">Discover Laws</button>
        </div>

        <div id="output"></div>

    </div>

    <div class="panel">
        <h5>Plot Window A</h5>
        <img id="img1" src="">
    </div>

    <div class="panel">
        <h5>Plot Window B</h5>
        <img id="img2" src="">
    </div>

    <div class="panel">
        <h5>Plot Window C</h5>
        <img id="img3" src="">
    </div>

</div>

<script>
function parsePi(){
    return document.getElementById("piInput").value
        .split(",")
        .map(x => parseFloat(x.trim()))
        .filter(x => !isNaN(x));
}

function gammaVal(){
    return parseFloat(document.getElementById("gammaInput").value);
}

function postData(url, payload, callback){
    fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(d => callback(d))
    .catch(err => {
        document.getElementById("output").innerText = "ERROR:\n" + err;
        console.error(err);
    });
}

function show(obj){
    document.getElementById("output").innerText = JSON.stringify(obj,null,2);
}

function runHermitian(){
    postData("/hermitian_metrics", {
        pi: parsePi()
    }, d => {
        show(d);
    });
}

function runNH(){
    postData("/nonhermitian_metrics", {
        pi: parsePi(),
        gamma: gammaVal()
    }, d => {
        show(d);
    });
}

function runResolvent(){
    postData("/resolvent_scan", {
        pi: parsePi(),
        gamma: gammaVal()
    }, d => {
        show(d);

        if(d.plot){
            img1.src = "/" + d.plot + "?" + Date.now();
        }
    });
}

function sweepAtlas(){
    postData("/atlas_sweep", {}, d => {
        show(d);
        alert("Atlas sweep complete.");
    });
}

function mineAtlas(){
    postData("/mine_atlas", {}, d => {
        show(d);

        if(d.plot1){ img1.src = "/" + d.plot1 + "?" + Date.now(); }
        if(d.plot2){ img2.src = "/" + d.plot2 + "?" + Date.now(); }
        if(d.plot3){ img3.src = "/" + d.plot3 + "?" + Date.now(); }

        alert("Atlas mined.");
    });
}

function discover(){
    postData("/discover", {}, d => {
        show(d);

        let msg = "";
        if(d.conjectures && d.conjectures.length > 0){
            msg += "CONJECTURES FOUND:\n\n";
            msg += d.conjectures.join("\n");
        }else{
            msg += "No strong conjectures extracted.";
        }

        alert(msg);
    });
}
</script>

</body>
</html>
